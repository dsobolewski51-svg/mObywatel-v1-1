<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>mObywatel - Logowanie</title>
    
    <!-- PWA / iPhone configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="mObywatel">
    <link rel="apple-touch-icon" href="logowanie/otM5jOA.png">
    
    <link rel="stylesheet" href="logowanie/main.css">
    <link rel="stylesheet" href="logowanie/id.css">
</head>
<body style="background-color: #121212; color: white;">
    <div class="background" style="background-image: none; background-color: #121212;"></div>
    
    <div class="top_grid">
        <img class="logo" src="logowanie/COI.png" alt="COI">
        <img class="logo_other" src="logowanie/otM5jOA.png" alt="mObywatel">
    </div>
    
    <div class="data">
        <div class="welcome"></div>
    </div>
    
    <div class="login_title">Zaloguj się</div>
    
    <div class="password_box" style="background-color: #1e1e1e;">
        <div class="password_grid">
            <div class="password_text" style="color: white;">Hasło</div>
            <div class="input_holder">
                <input type="password" class="password_input" placeholder="Wprowadź hasło" style="background-color: #2a2a2a; color: white; border: 1px solid #444;">
                <div class="eye"></div>
            </div>
            <div class="forgot_password" style="color: #4a9ff5;">Zapomniałeś hasła?</div>
        </div>
    </div>
    
    <div class="bottom">
        <div class="login" style="background-color: #4a9ff5; color: #0f172a;">Zaloguj się</div>
    </div>

    <script src="logowanie/id.js"></script>
</body>
</html>
