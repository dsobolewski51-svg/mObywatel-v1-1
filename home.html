<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>mObywatel</title>
    
    <!-- PWA / iPhone configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="mObywatel">
    <link rel="apple-touch-icon" href="assets/images/otM5jOA.png">
    
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/home.css">
    <style>
        /* Dark mode modifications */
        body {
            background-color: #121212 !important;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .container {
            padding: 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top_grid {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .main_logo {
            border-radius: 8px;
            width: 35px;
        }

        .right {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-right: 0;
            margin-left: auto;
        }
        
        .icon_btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: white;
            display: flex;
        }

        .page_title {
            font-size: 28px;
            font-weight: 600;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: linear-gradient(135deg, #0052cc 0%, #0073e6 100%) !important;
            border-radius: 16px;
            height: 220px;
            width: 100%;
            border: none;
            box-shadow: none;
            position: relative;
        }

        .card_title {
            color: white;
            font-size: 20px;
            font-weight: 600;
            padding: 20px;
            display: block;
        }
        
        .card_emblem {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .dostosuj_widok {
            color: #4da6ff;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: block;
            margin-top: 15px;
        }

        .dodaj_dokument_btn {
            background-color: #4a9ff5;
            color: #0f172a;
            border: none;
            border-radius: 14px;
            padding: 14px 22px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            position: fixed;
            bottom: calc(95px + env(safe-area-inset-bottom));
            right: 20px;
            box-shadow: none;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bottom_bar {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            box-sizing: border-box !important;
            background-color: #121212 !important;
            border-top: none !important;
            height: auto !important;
            padding-top: 12px !important;
            padding-bottom: calc(2px + env(safe-area-inset-bottom)) !important;
            display: flex;
            align-items: center;
            z-index: 5;
        }

        .bottom_bar_grid {
            grid-template-columns: repeat(4, 25%) !important;
            margin-top: 0 !important;
            height: auto !important;
            align-items: center;
        }
        
        .bottom_element_grid {
            margin-top: 0 !important;
            justify-content: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .active_icon_bg {
            background-color: #0b2545; /* Dark blue pill */
            padding: 4px 20px;
            border-radius: 16px;
            margin-bottom: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom_element_image {
            margin-bottom: 4px !important;
        }
        
        .active_icon_bg .bottom_element_image {
            margin-bottom: 0 !important;
        }

        .bottom_element_text {
            color: #888888 !important;
            margin-top: 0 !important;
            font-size: 11px;
            font-weight: 500;
        }

        .bottom_element_text.open {
            color: #4da6ff !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top_grid">
        <!-- Main Logo -->
        <img class="main_logo" src="assets/images/otM5jOA.png" alt="Logo">
        
        <!-- Right Icons -->
        <div class="right">
            <button class="icon_btn">

            </button>
            <button class="icon_btn" style="position: relative;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span style="position: absolute; top: -2px; right: 2px; width: 8px; height: 8px; background-color: #e21c22; border-radius: 50%;"></span>
            </button>
        </div>
    </div>
